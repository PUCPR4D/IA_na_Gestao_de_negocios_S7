<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Continuidade dos Negócios</title>
</head>
<body>
<div id="quiz-continuidade" style="max-width:900px;margin:auto;padding:30px;font-family:Arial,sans-serif;background:#F7F3FB;border-radius:20px;color:#4F4269;">
<h2 style="color:#8A0538;margin-top:0;font-size:28px;text-align:center;">🧠 Continuidade dos negócios: mito ou realidade?</h2>
<p style="font-size:18px;text-align:center;">Depois de concluir esta unidade, teste sua percepção sobre continuidade dos negócios e inteligência artificial.</p>
<div id="quiz"></div>
<div style="text-align:center;"><button onclick="corrigirQuiz()" style="background:#8F5CF7;color:white;border:none;padding:14px 28px;font-size:16px;border-radius:50px;cursor:pointer;font-weight:bold;margin-top:15px;">Ver meu resultado</button></div>
<div id="resultado" style="margin-top:25px;"></div>
</div>
<script>
const perguntas=[{texto:'Se uma solução de IA continua funcionando tecnicamente, ela continuará gerando valor para o negócio.',correta:'falso',explicacao:'Uma solução pode continuar funcionando normalmente e, ainda assim, deixar de atender às necessidades do negócio.'},{texto:'Organizações maduras revisam periodicamente soluções que já apresentam bons resultados.',correta:'verdadeiro',explicacao:'A continuidade depende da capacidade de avaliar constantemente se a solução continua alinhada aos objetivos organizacionais.'},{texto:'Continuidade dos negócios está relacionada apenas à infraestrutura tecnológica.',correta:'falso',explicacao:'Além da tecnologia, a continuidade depende de pessoas, processos, conhecimento e capacidade de adaptação.'},{texto:'Em alguns casos, encerrar uma solução pode ser uma decisão estratégica adequada.',correta:'verdadeiro',explicacao:'Quando uma iniciativa deixa de gerar valor, seu encerramento pode representar maturidade organizacional.'},{texto:'Uma solução de IA pode se tornar um risco para a organização mesmo apresentando bons indicadores.',correta:'verdadeiro',explicacao:'Mudanças no mercado ou nos objetivos do negócio podem reduzir a relevância da solução ao longo do tempo.'},{texto:'Adaptar-se significa substituir todas as soluções existentes por tecnologias mais modernas.',correta:'falso',explicacao:'Muitas vezes a adaptação acontece por meio de ajustes, melhorias e evolução gradual das soluções já existentes.'}];
const container=document.getElementById('quiz');
perguntas.forEach((p,i)=>{container.innerHTML += `<div style="background:white;padding:20px;margin-top:18px;border-radius:16px;border-left:6px solid #8F5CF7;box-shadow:0px 2px 10px rgba(0,0,0,0.06);"><p style="font-size:17px;margin-top:0;font-weight:600;">${i+1}. ${p.texto}</p><label><input type="radio" name="q${i}" value="verdadeiro"> Verdadeiro</label><br><br><label><input type="radio" name="q${i}" value="falso"> Falso</label><div id="feedback${i}" style="margin-top:12px;"></div></div>`});
function corrigirQuiz(){let acertos=0;perguntas.forEach((p,i)=>{const resposta=document.querySelector(`input[name="q${i}"]:checked`);const feedback=document.getElementById(`feedback${i}`);if(!resposta){feedback.innerHTML=`<div style="padding:10px;border-radius:10px;background:#FFF4F4;color:#B00020;">Selecione uma resposta.</div>`;return;}if(resposta.value===p.correta){acertos++;feedback.innerHTML=`<div style="background:#F1E9FF;padding:12px;border-radius:12px;border-left:5px solid #8F5CF7;"><strong style="color:#6A35D4;">✔ Correto!</strong><br><br>${p.explicacao}</div>`;}else{feedback.innerHTML=`<div style="background:#FCEEF3;padding:12px;border-radius:12px;border-left:5px solid #8A0538;"><strong style="color:#8A0538;">✘ Resposta incorreta</strong><br><br>${p.explicacao}</div>`;}});let mensagem='';if(acertos===6){mensagem='Excelente! Você demonstrou uma compreensão muito consistente sobre continuidade dos negócios e geração de valor com IA.';}else if(acertos>=4){mensagem='Ótimo resultado! Os conceitos principais da unidade parecem estar claros para você.';}else{mensagem='Vale a pena revisitar alguns pontos da unidade. A continuidade dos negócios envolve muito mais do que manter a tecnologia funcionando.';}document.getElementById('resultado').innerHTML=`<div style="background:white;padding:25px;margin-top:25px;border-radius:16px;border-top:6px solid #8F5CF7;text-align:center;box-shadow:0px 2px 10px rgba(0,0,0,0.06);"><h3 style="color:#8A0538;margin-top:0;">Resultado</h3><div style="font-size:42px;font-weight:bold;color:#6A35D4;">${acertos}/${perguntas.length}</div><p style="font-size:18px;">${mensagem}</p><p style="background:#F7F3FB;padding:15px;border-radius:12px;margin-top:15px;"><strong>Lembre-se:</strong> continuidade dos negócios não significa apenas manter soluções funcionando. Significa garantir que elas continuem gerando valor mesmo diante de mudanças, desafios e novas necessidades organizacionais.</p></div>`;}
</script>
</body></html>
